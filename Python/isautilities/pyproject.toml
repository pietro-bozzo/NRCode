[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isautilities"
version = "0.1.0"
description = "Utilities for InfraSlow Avalanches project"
authors = [{name = "Pietro Bozzo"}]
readme = "README.md"
license = "GPL-3.0-or-later"

requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
